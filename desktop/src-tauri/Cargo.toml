[package]
name = "petarin-desktop"
version = "1.0.10"
description = "ぺたりん デスクトップ版（画面の端から付箋が生える常駐アプリ）"
authors = ["Kagayoi"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-store = "2"
tauri-plugin-single-instance = "2"
# スタートアップ登録（トレイのチェック項目）。レジストリ Run キーを自前で書くと exe パスの
# 引用符・更新後のパス追従・解除漏れを全部自前で持つことになるので公式プラグインに寄せる。
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
velopack = "1.2.0"

# 前面アプリが全画面かを判定するためだけの Win32 束縛（フルスクリーン中は最前面を降りる）。
# tauri が既に同じ crate を推移依存で持っているので、新しくダウンロードされるものは無い。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
] }

[features]
# 既定は production。`cargo build --features custom-protocol` は tauri build が付ける。
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
