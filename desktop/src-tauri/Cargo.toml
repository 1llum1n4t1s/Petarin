[package]
name = "petarin-desktop"
version = "0.1.1"
description = "ぺたりん デスクトップ版（画面の端から付箋が生える常駐アプリ）"
authors = ["Kagayoi"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-store = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
velopack = "1.2.0"

[features]
# 既定は production。`cargo build --features custom-protocol` は tauri build が付ける。
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
