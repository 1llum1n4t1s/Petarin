# ぺたりん iOS（Flutter）のビルド検証と TestFlight 配信。
# Flutter SDK はバージョンを固定して公式リポジトリから取得し、サードパーティ Action を増やさない。
# build job は simulator 向けの署名なし検証。testflight job は既存の配布証明書と
# provisioning profile で manual signing し、App Store Connect API キーでアップロードする。
name: mobile-ios

on:
  workflow_dispatch:
    inputs:
      testflight:
        description: "署名付きFlutterビルドをTestFlightへアップロードする"
        type: boolean
        default: false
  push:
    tags:
      - "mobile-v*"

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.6"

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile_flutter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0
        with:
          persist-credentials: false

      - name: 最新Xcodeを選択
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "selected: $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Flutter SDKを準備
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" doctor -v

      - name: 依存関係を固定lockfileから取得
        run: flutter pub get --enforce-lockfile

      - name: 静的解析
        run: flutter analyze

      - name: Dartテスト
        run: flutter test

      - name: iOS simulator向けコンパイル検証
        run: flutter build ios --simulator --debug --no-codesign

  testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile_flutter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0
        with:
          persist-credentials: false

      - name: 最新Xcodeを選択（App Store ConnectのSDK要件に追従）
        run: |
          ls -d /Applications/Xcode*.app
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "selected: $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Flutter SDKを準備
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" doctor -v

      - name: 依存関係とリリース用iOS生成物を準備
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
          # TestFlight では公式テスト広告を使い、実広告への誤操作を防ぐ。
          flutter build ios --release --no-codesign \
            --dart-define=ADMOB_IOS_BANNER_ID=ca-app-pub-3940256099942544/2435281174

      - name: 署名素材を配置（p12・プロファイル・ASC APIキー）
        env:
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASS=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          echo "$IOS_DIST_P12_BASE64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$IOS_DIST_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > "$HOME/Library/MobileDevice/Provisioning Profiles/2583001d-a6c8-40b3-8fe7-b26505c06506.mobileprovision"

          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Archive（manual signing・App Store配布向け）
        working-directory: mobile_flutter/ios
        run: |
          set -o pipefail
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" archive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            FLUTTER_BUILD_NUMBER=${{ github.run_number }} | tail -40

      - name: Export .ipa
        working-directory: mobile_flutter/ios
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/exportOptions.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>SL228Y8UUR</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>jp.nephilim.petarin</key><string>Petarin AppStore</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist" | tail -20
          ls -la "$RUNNER_TEMP/export"

      - name: TestFlightへアップロード
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          ipa=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          echo "upload: $ipa"
          xcrun altool --upload-app --type ios -f "$ipa" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
