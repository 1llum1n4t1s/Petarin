# ぺたりん モバイル: iOS ビルド検証（Capacitor 8・Swift Package Manager）。
# web を Vite でビルド → cap add ios（毎回生成・ios/ は gitignore）→ Info.plist に NSCameraUsageDescription を
# 注入（QR スキャナの getUserMedia 用・Android の CAMERA 注入と対称）→ 署名なしで simulator 向けにコンパイル検証。
# build job はコンパイルが通るかの検証（署名なし）。testflight job（workflow_dispatch の testflight=true）は
# ASC API キーの cloud signing で署名付き .ipa を作り TestFlight へアップロードする（Secrets: ASC_*）。
# Capacitor 8 は Xcode 26+ を要求＝runner の Xcode 次第（未達ならこの job は環境要件待ちとして赤くなる）。
# Actions はサプライチェーン対策で full commit SHA にピン留め（publish.yml / mobile-android.yml と同方針・Dependabot 更新）。
name: mobile-ios

on:
  workflow_dispatch:
    inputs:
      testflight:
        description: "署名付きビルドを TestFlight へアップロードする"
        type: boolean
        default: false
  push:
    tags:
      - "mobile-v*"

permissions:
  contents: read

jobs:
  build:
    # macos-latest はイメージ更新で Xcode が変わり「Xcode 26+ 必須」を非決定的にするため固定する。
    # Cap8 要件の Xcode が無ければこの job は失敗＝要件未達が可視化される（必要なら setup-xcode で pin）。
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.0
        with:
          persist-credentials: false # 読み取り専用ビルド＝認証情報を .git/config に残さない

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.0.0
        with:
          node-version: 22
          package-manager-cache: false # PR 由来の cache poisoning を release に伝播させない

      - name: Enable corepack (pnpm)
        run: corepack enable

      # 供給網リスク低減: 全ビルド許可せず mobile/pnpm-workspace.yaml の allowBuilds(esbuild のみ)で許可する。
      # --ignore-workspace を付けると pnpm-workspace.yaml=allowBuilds が読まれず ignored builds になるので付けない
      #（mobile/pnpm-workspace.yaml があるため上位の repo ルート workspace には巻き込まれない）。
      - name: Install deps
        run: pnpm install --frozen-lockfile # lockfile を固定＝CI で依存解決の非決定性/drift を防ぐ

      - name: Build web (Vite)
        run: pnpm build

      - name: Add iOS platform
        run: pnpm exec cap add ios

      - name: Capacitor sync
        run: pnpm exec cap sync ios

      - name: Info.plist へ NSCameraUsageDescription 注入 (QR スキャナの getUserMedia 用)
        working-directory: mobile/ios
        run: |
          # iOS 14.3+ の WKWebView は getUserMedia 対応だが、Info.plist のカメラ用途説明が無いと実行時に拒否される。
          # Android の CAMERA 注入と対称に「生成物に依存せず再現可能」に注入する（Delete→Add で冪等）。
          plist=App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :NSCameraUsageDescription" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'QRコードを読み取ってグループに参加するためにカメラを使用します'" "$plist"
          echo "--- Info.plist のカメラ用途 ---"; /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$plist"

      - name: Xcode で署名なしコンパイル検証 (simulator)
        working-directory: mobile/ios/App
        run: |
          # 署名・provisioning は Apple Developer 証明書が要るので CI ではコンパイル検証のみ（simulator SDK）。
          # 実機 .ipa / App Store 申請は別（証明書を Secrets に入れてから署名ビルドを足す）。
          # In-App Purchase(StoreKit2) は entitlement 不要＝App Store Connect の product 登録で機能する。
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tail -40

  # ── TestFlight 配信（workflow_dispatch で testflight=true のときだけ）──────────────────────
  # 署名は manual signing（Apple Distribution 証明書 p12 + App Store プロファイル）。
  # cloud signing（-allowProvisioningUpdates だけで完結する方式）は API キーのロールが
  # クラウド管理証明書に届かず "Cloud signing permission error" になったため、ASC API で
  # 発行した証明書/プロファイル（Secret リポ apple_signing/petarin/ に保管・発行手順は
  # secrets.json の petarin_ios_dist 参照）を Secrets 経由で注入する。アップロードは API キー（altool）。
  # 前提: App Store Connect にアプリレコード（jp.nephilim.petarin）が作成済みであること。
  testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build web (Vite)
        run: pnpm build

      - name: Add iOS platform
        run: pnpm exec cap add ios

      - name: Capacitor sync
        run: pnpm exec cap sync ios

      - name: Info.plist 注入（カメラ用途・輸出コンプライアンス）
        working-directory: mobile/ios
        run: |
          plist=App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :NSCameraUsageDescription" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'QRコードを読み取ってグループに参加するためにカメラを使用します'" "$plist"
          # 標準アルゴリズム（WebCrypto の AES-GCM/ECDSA）のみ＝輸出規制の適用除外。false を宣言すると
          # TestFlight 配信ごとの輸出コンプライアンス質問がスキップされ、アップロード→即テスト可能になる。
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$plist"

      - name: 署名素材を配置（p12 → 一時キーチェーン・プロファイル・ASC API キー）
        env:
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          # 一時キーチェーンに Apple Distribution 証明書を import（runner は使い捨てだが作法として専用キーチェーン）
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASS=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          echo "$IOS_DIST_P12_BASE64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$IOS_DIST_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          # プロビジョニングプロファイルを規定パスへ（UUID 名で配置）
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > "$HOME/Library/MobileDevice/Provisioning Profiles/2583001d-a6c8-40b3-8fe7-b26505c06506.mobileprovision"
          # altool（アップロード）用の ASC API キー
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Archive（manual signing・App Store 配布向け）
        working-directory: mobile/ios/App
        run: |
          set -o pipefail
          # ビルド番号は run_number で単調増加させる（TestFlight は同一ビルド番号の再アップロードを拒否する）
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=SL228Y8UUR \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Petarin AppStore" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} | tail -40

      - name: Export .ipa
        working-directory: mobile/ios/App
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/exportOptions.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>SL228Y8UUR</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>jp.nephilim.petarin</key><string>Petarin AppStore</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist" | tail -20
          ls -la "$RUNNER_TEMP/export"

      - name: TestFlight へアップロード
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          ipa=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          echo "upload: $ipa"
          xcrun altool --upload-app --type ios -f "$ipa" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
