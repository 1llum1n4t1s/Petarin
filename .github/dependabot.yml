# Dependabot 設定
#
# GitHub Actions の SHA ピン留め推奨 (https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-third-party-actions)
# に従い、Actions を SHA + タグコメントの形に保つための自動 PR 設定。
# 依存の単位はリポジトリ内に 5 つある（npm 3 つ + Cargo + pub）ので、すべてを見張る。
version: 2
updates:
  # GitHub Actions の SHA ピン留め維持
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # npm 依存の脆弱性 / マイナーバージョン追随
  # / = 拡張のビルドツール / mobile = Capacitor / desktop = Tauri
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/mobile"
      - "/desktop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # デスクトップ版（Tauri v2）の Rust クレート
  - package-ecosystem: "cargo"
    directory: "/desktop/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # iOS アプリ（Flutter）の pub パッケージ
  - package-ecosystem: "pub"
    directory: "/mobile_flutter"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      pub-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
